version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tandur_prod_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tandur_db}
      POSTGRES_USER: ${POSTGRES_USER:-tandur_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - tandur_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tandur_admin} -d ${POSTGRES_DB:-tandur_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tandur_network

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy vps/Dockerfile.backend
    container_name: tandur_prod_backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-tandur_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tandur_db}
      SECRET_KEY: ${SECRET_KEY}
      GEE_KEY_PATH: /app/credentials/paci-x-a7a003954fc1.json
      GEE_SERVICE_ACCOUNT: ${GEE_SERVICE_ACCOUNT:-astral-monitor@paci-x.iam.gserviceaccount.com}
      GEE_PROJECT: ${GEE_PROJECT:-paci-x}
      MAPBOX_TOKEN: ${MAPBOX_TOKEN}
      ENVIRONMENT: production
      DEBUG: "False"
      BACKEND_CORS_ORIGINS: '["https://${DOMAIN_NAME}"]'
    volumes:
      - ../backend/credentials:/app/credentials:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - tandur_network

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy vps/Dockerfile.frontend
      args:
        NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN}
        NEXT_PUBLIC_API_BASE_URL: /api
    container_name: tandur_prod_frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - backend
    networks:
      - tandur_network

  nginx:
    image: nginx:alpine
    container_name: tandur_prod_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./tandur_nginx_docker.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - tandur_network

networks:
  tandur_network:
    driver: bridge

volumes:
  tandur_pgdata:
    driver: local
