# ==============================================================================
# TANDUR - PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# Lokasi di server: /etc/nginx/sites-available/tandur.conf
# Simlink aktif: ln -s /etc/nginx/sites-available/tandur.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Definisi Upstream Pool
upstream tandur_frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream tandur_backend_upstream {
    server 127.0.0.1:8000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Redirect Port 80 ke HTTPS (Let's Encrypt Certbot Ready)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tandur.yourdomain.com; # GANTI dengan domain/subdomain VPS Anda

    # Verifikasi Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect seluruh trafik HTTP biasa ke HTTPS aman
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Main Production Gateway
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tandur.yourdomain.com; # GANTI dengan domain/subdomain VPS Anda

    # Sertifikat SSL Let's Encrypt (Dibuat otomatis oleh certbot)
    ssl_certificate /etc/letsencrypt/live/tandur.yourdomain.com/fullchain.pem; # GANTI dengan path sertifikat Anda
    ssl_certificate_key /etc/letsencrypt/live/tandur.yourdomain.com/privkey.pem; # GANTI dengan path privkey Anda
    ssl_trusted_certificate /etc/letsencrypt/live/tandur.yourdomain.com/chain.pem;

    # Optimasi Protokol & Cipher SSL Modern (Mozilla Intermediate Recommendation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers Produksi
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # Batas ukuran payload request (untuk upload KML/GeoJSON poligon lahan & foto lapangan)
    client_max_body_size 50M;

    # Pengaturan Log
    access_log /var/log/nginx/tandur_access.log;
    error_log /var/log/nginx/tandur_error.log warn;

    # Kompresi Gzip Dinamis
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # A. Static Asset Cache Next.js (Performa Ekstrim)
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://tandur_frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static media / favicon / robots
    location ~* \.(ico|jpg|jpeg|png|gif|svg|webp|woff|woff2|ttf|eot)$ {
        proxy_pass http://tandur_frontend_upstream;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, max-age=2592000";
    }

    # --------------------------------------------------------------------------
    # B. Backend API Route (/api/) - FastAPI
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://tandur_backend_upstream;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeout tinggi untuk komputasi citra satelit GEE & analisis spasial berat
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout 300s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # OpenAPI Dokumentasi Backend
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://tandur_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # C. Frontend Web Application (Next.js) + WebSocket HMR / Realtime Support
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://tandur_frontend_upstream;
        proxy_http_version 1.1;

        # Header WebSocket & Keepalive
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
